[project]
name = "pymusicbrowser"
version = "0.1.0"
description = "Python Music Browser - A music browser/player"
readme = "README.md"
authors = [
    { name = "xefiry", email = "188508735+xefiry@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.48.1",
    "peewee>=4.5.3",
    "pillow>=13.0.0",
    "pygame>=2.6.1",
    "pynput>=1.8.2",
    "pyside6>=6.12.0",
]

[project.scripts]
pymusicbrowser = "pymusicbrowser:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyside6-utils>=1.2.2",
]
